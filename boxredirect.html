<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Box Login Redirect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin-top: 40px;
            color: #333;
        }
        a.button {
            display: inline-block;
            padding: 14px 22px;
            background: #007aff;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <p>Login successful.</p>
    <p>Tap the button below to return to the app.</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        function openApp() {
            if (code) {
                // 1) Open the app via deeplink (user-initiated → no popup)
                window.location.href = "myturntable://boxauth?code=" + code;
            }

            // 2) After 1 second, navigate to your main website
            setTimeout(() => {
                window.location.href = "https://myturntable.eu";
            }, 1000);
        }
    </script>

    <a class="button" onclick="openApp()">Return to MyTurntable</a>

</body>
</html>
