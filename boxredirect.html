<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Redirect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        function getQueryParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        function isMobile() {
            return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        function redirectToApp() {
            const code = getQueryParam('code');

            if (!code) {
                document.body.innerHTML = "<p>No auth code found.</p>";
                return;
            }

            const deepLink = "myturntable://boxauth?code=" + encodeURIComponent(code);

            if (isMobile()) {
                // AUTOMATIKUS deep-link mobilon
                window.location.href = deepLink;

                // Biztonsági fallback: ha nem nyílik meg az app
                setTimeout(() => {
                    document.getElementById("fallback").style.display = "block";
                }, 2000);
            } else {
                // Desktop fallback
                document.getElementById("desktop").style.display = "block";
                document.getElementById("code").innerText = code;
            }
        }

        window.onload = redirectToApp;
    </script>

    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 40px; }
        .button {
            display: inline-block;
            padding: 14px 22px;
            background: #007aff;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <p>Redirecting to MyTurntable...</p>

    <div id="fallback" style="display:none;">
        <p>If the app did not open automatically, tap below:</p>
        <a class="button" href="#" onclick="window.location.href = deepLink;">Open MyTurntable</a>
    </div>

    <div id="desktop" style="display:none;">
        <p>Auth code (desktop mode):</p>
        <pre id="code"></pre>
    </div>
</body>
</html>
